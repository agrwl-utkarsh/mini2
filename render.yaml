services:
  - type: web
    name: reposense-api
    runtime: python
    pythonVersion: "3.11"
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: CORS_ORIGINS_STR
        value: "https://mini2-97sb1acoq-uagarwal212-5073.vercel.app,http://localhost:5173"
      - key: REPO_BASE_PATH
        value: "/tmp/reposense"
      - key: MAX_REPO_SIZE_MB
        value: "100"
      - key: MAX_FILES
        value: "1000"